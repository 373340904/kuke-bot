<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KukeChat 机器人控制面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #16213e;
  padding: 16px 24px;
  border-bottom: 1px solid #0f3460;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
header h1 { font-size: 18px; color: #e94560; }
.status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #666; display: inline-block;
  box-shadow: 0 0 8px currentColor;
}
.status-dot.connected { background: #4caf50; color: #4caf50; }
.status-dot.connecting { background: #ff9800; color: #ff9800; animation: pulse 1s infinite; }
.status-dot.disconnected { background: #f44336; color: #f44336; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-text { font-size: 13px; color: #aaa; }
.controls {
  display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap;
}
.controls input {
  background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 280px;
}
.controls button {
  background: #e94560; color: #fff; border: none; padding: 8px 16px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.controls button:hover { background: #c73650; }
.controls button.disconnect { background: #666; }
.controls button.disconnect:hover { background: #555; }
.main { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; }
.log-container {
  flex: 1; background: #0d1117; border-radius: 8px; padding: 10px;
  overflow-y: auto; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px;
  line-height: 1.4; border: 1px solid #21262d; max-height: calc(100vh - 180px);
}
.log-line { padding: 1px 0; word-break: break-all; }
.log-time { color: #6e7681; }
.log-recv { color: #58a6ff; }
.log-send { color: #3fb950; }
.log-error { color: #f85149; }
.log-system { color: #d29922; }
footer {
  background: #16213e; padding: 8px 24px; font-size: 12px; color: #888;
  border-top: 1px solid #0f3460; display: flex; gap: 24px; flex-wrap: wrap;
}
footer span { color: #aaa; }
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #16213e; border-radius: 12px; padding: 24px; width: 420px; max-width: 90%;
  border: 1px solid #0f3460; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.modal h3 { color: #e94560; margin-bottom: 16px; font-size: 16px; }
.modal input, .modal textarea {
  width: 100%; background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;
  font-family: inherit;
}
.modal textarea { min-height: 120px; resize: vertical; }
.modal button {
  background: #e94560; color: #fff; border: none; padding: 10px 20px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%;
}
.modal button:hover { background: #c73650; }
.modal .cancel-btn { background: #555; margin-top: 8px; }
.modal .cancel-btn:hover { background: #444; }
.modal .hint { font-size: 11px; color: #888; margin-bottom: 12px; }
.send-bar {
  display: flex; gap: 8px; padding: 12px 24px; background: #16213e;
  border-top: 1px solid #0f3460; align-items: center;
}
.send-bar select {
  background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 8px 12px; border-radius: 6px; font-size: 13px; min-width: 120px;
}
.send-bar input {
  flex: 1; background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 8px 12px; border-radius: 6px; font-size: 13px;
}
.send-bar button {
  background: #e94560; color: #fff; border: none; padding: 8px 20px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.send-bar button:hover { background: #c73650; }
.send-bar button:disabled { background: #555; cursor: not-allowed; }
.user-bar {
  display: flex; gap: 8px; padding: 8px 24px; background: #1a1a2e;
  border-top: 1px solid #0f3460; align-items: center; font-size: 12px;
}
.user-bar input {
  background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 6px 10px; border-radius: 4px; font-size: 12px; width: 120px;
}
.user-bar button {
  background: #4caf50; color: #fff; border: none; padding: 6px 14px;
  border-radius: 4px; cursor: pointer; font-size: 12px;
}
.user-bar button:hover { background: #3d8b40; }
.user-bar .status { color: #aaa; }
.user-bar .logged-in { color: #4caf50; }
.send-identity {
  background: #0f3460; border: 1px solid #16213e; color: #eee;
  padding: 8px 12px; border-radius: 6px; font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>KukeChat 机器人控制面板</h1>
  <span class="status-dot disconnected" id="statusDot"></span>
  <span class="status-text" id="statusText">未连接</span>
  <div class="controls">
    <input type="password" id="botKey" placeholder="输入 Bot Key" />
    <button id="pushBtn" style="background:#555">全局推送</button>
    <button id="connectBtn">连接</button>
  </div>
</header>
<div class="main">
  <div class="log-container" id="logContainer"></div>
</div>
<div class="send-bar">
  <select id="sendGroupSelect">
    <option value="">选择群...</option>
  </select>
  <select class="send-identity" id="sendIdentity">
    <option value="bot">Bot身份</option>
    <option value="user" disabled>用户身份（未登录）</option>
  </select>
  <input type="text" id="sendMessageInput" placeholder="输入消息，回车发送（支持Markdown）" />
  <button id="sendMessageBtn">发送</button>
</div>
<div class="user-bar">
  <span class="status" id="userStatus">未登录用户账号</span>
  <input type="text" id="userAccount" placeholder="用户名/邮箱" />
  <input type="password" id="userPassword" placeholder="密码" />
  <button id="userLoginBtn">登录</button>
  <button id="userLogoutBtn" style="display:none;background:#f44336">退出</button>
</div>
<footer>
  <span>Bot ID: <span id="botId">-</span></span>
  <span>User ID: <span id="userId">-</span></span>
  <span style="margin-left:auto">数据存储于浏览器本地</span>
</footer>

<div class="modal-overlay" id="pushModal">
  <div class="modal">
    <h3 id="pushModalTitle">全局推送 - 密码验证</h3>
    <div id="pushPasswordStep">
      <input type="password" id="pushPassword" placeholder="请输入密码" />
      <button id="pushPasswordBtn">确认</button>
      <button class="cancel-btn" onclick="closePushModal()">取消</button>
    </div>
    <div id="pushFormStep" style="display:none">
      <input type="text" id="pushTitle" placeholder="推送标题" />
      <textarea id="pushContent" placeholder="推送内容，用 /n 换行"></textarea>
      <div class="hint">将推送给机器人所在的所有群</div>
      <button id="pushSendBtn">发送推送</button>
      <button class="cancel-btn" onclick="closePushModal()">取消</button>
    </div>
  </div>
</div>

<script>
const BASE_URL = '/.netlify/functions/api';
let ws = null;
let botKey = '';
let botUserId = null;
let reconnectTimer = null;
const seenIds = new Set();

const $ = id => document.getElementById(id);
const logContainer = $('logContainer');

function log(type, msg) {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'log-line log-' + type;
  line.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
  logContainer.appendChild(line);
  logContainer.scrollTop = logContainer.scrollHeight;
}

function setStatus(state, text) {
  const dot = $('statusDot');
  dot.className = 'status-dot ' + state;
  $('statusText').textContent = text;
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// localStorage helpers
function getCheckinData() {
  try { return JSON.parse(localStorage.getItem('kuke_checkin_data')) || { date: '', conversations: {} }; }
  catch { return { date: '', conversations: {} }; }
}
function saveCheckinData(d) { localStorage.setItem('kuke_checkin_data', JSON.stringify(d)); }
function getWelcomeData() {
  try { return JSON.parse(localStorage.getItem('kuke_welcome_data')) || {}; }
  catch { return {}; }
}
function saveWelcomeData(d) { localStorage.setItem('kuke_welcome_data', JSON.stringify(d)); }
function getGroups() {
  try { return JSON.parse(localStorage.getItem('kuke_groups')) || []; }
  catch { return []; }
}
function saveGroups(d) { localStorage.setItem('kuke_groups', JSON.stringify(d)); }
function addGroup(convId) {
  const groups = new Set(getGroups());
  if (!groups.has(convId)) { groups.add(convId); saveGroups([...groups]); refreshGroupSelect(); }
}

// API helpers
async function apiRequest(method, path, body) {
  const headers = { 'Authorization': `Bot ${botKey}` };
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(BASE_URL + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sendMsg(conversationId, text) {
  try {
    await apiRequest('POST', `/bot-api/conversations/${conversationId}/messages`, { message: text });
    log('send', `→ [群${conversationId}] ${text.slice(0,80)}${text.length>80?'...':''}`);
    return true;
  } catch(e) { log('error', `发送失败: ${e.message}`); return false; }
}

// Member helpers
function extractMembers(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.members)) return data.members;
  if (data && Array.isArray(data.data)) return data.data;
  if (data && Array.isArray(data.items)) return data.items;
  if (data && Array.isArray(data.users)) return data.users;
  return [];
}
function getUserId(m) { return m.user_id ?? m.id ?? m.uid ?? m.userId; }
function getUserName(m) {
  const d = m.nickname ?? m.display_name ?? m.name ?? m.username ?? m.user_display_name ?? m.member_nickname ?? m.group_nickname;
  if (d) return d;
  if (m.user) { const n = m.user.nickname ?? m.user.display_name ?? m.user.name ?? m.user.username; if (n) return n; }
  if (m.profile) { const n = m.profile.nickname ?? m.profile.display_name ?? m.profile.name; if (n) return n; }
  return '未知用户';
}
function isMemberOnline(m) {
  if (m.is_online === true || m.online === true || m.status === 'online') return true;
  if (m.is_online === false || m.online === false) return false;
  return null;
}

// Fortune
function generateFortune() {
  const fortunes = [
    { level: '大吉', desc: '万事顺意，心想事成，适合搞大事！' },
    { level: '吉', desc: '运势不错，稳步前行必有收获。' },
    { level: '中吉', desc: '平稳度日，不宜冒进，稳中求胜。' },
    { level: '小吉', desc: '小有收获，积少成多，继续努力。' },
    { level: '平', desc: '平平淡淡才是真，好好休息吧。' },
    { level: '凶', desc: '容易烦烦，少做决定（现实为准）。' },
    { level: '大凶', desc: '诸事不宜，躺平一天，别给自己找事。' },
  ];
  const colors = ['红色','蓝色','绿色','黄色','紫色','橙色','粉色','黑色','白色','青色','金色','银色'];
  const yiList = ['宜暴躁怼人！😆','宜摸鱼划水🐟','宜好好学习📚','宜早睡早起😴','宜喝杯奶茶🧋','宜打把游戏🎮','宜出门散步🚶','宜写代码💻','宜发呆放空😶','宜请人吃饭🍜','宜听首音乐🎵','宜运动健身💪'];
  return {
    fortune: fortunes[Math.floor(Math.random()*fortunes.length)],
    star: Math.floor(Math.random()*100)+1,
    luckyNum: Math.floor(Math.random()*99)+1,
    color: colors[Math.floor(Math.random()*colors.length)],
    yi: yiList[Math.floor(Math.random()*yiList.length)],
  };
}

function buildCheckinCard(userName, today, rank, fl, fd, star, luckyNum, color, yi, title) {
  const t = title || '✅签到完成！';
  return `<markdown># ${t}

- **用户：**${userName}
- **日期：**\`${today}\`
- **排名：**你是今日第 \`${rank}\` 签到的人

## 🎲今日运势

🔮${fl}
> ${fd}
- **幸运星星：**\`${star}/100\`
- **幸运数字：**\`${luckyNum}\`
- **幸运色：**${color}
- **宜：**${yi}

❤️今日签到已完成，明日再来吧~</markdown>`;
}

async function isAdminOrOwner(convId, userId, sender) {
  if (sender) {
    const r = sender.role || sender.user_role || sender.permission;
    if (r === 'owner' || r === 'admin') return true;
    if (sender.is_owner === true || sender.is_admin === true) return true;
  }
  try {
    const data = await apiRequest('GET', `/bot-api/conversations/${convId}/members`);
    const members = extractMembers(data);
    const m = members.find(x => getUserId(x) === userId);
    if (!m) return false;
    const r = m.role || m.user_role || m.permission || (m.user && m.user.role);
    return r === 'owner' || r === 'admin' || m.is_owner === true || m.is_admin === true;
  } catch { return false; }
}

// Command handlers
async function handleMessage(msg) {
  if (msg.sender?.is_bot || msg.sender_id === botUserId) return;
  if (!msg.content?.trim()) return;
  if (seenIds.has(msg.id)) return;
  seenIds.add(msg.id);
  if (seenIds.size > 500) seenIds.clear();

  const content = msg.content.trim();
  const convId = msg.conversation_id;
  const userName = msg.sender_display_name || msg.sender?.nickname || '未知用户';

  // 记录群ID，用于全局推送
  addGroup(convId);

  log('recv', `← [群${convId}] ${userName}: ${content.slice(0,100)}`);

  if (content === '/help') {
    sendMsg(convId, `<markdown>📖 指令列表

- /help：查看本菜单
- /群在线人数：查看当前群内在线人数和在线用户列表
- /签到：每日签到
- /天气[城市]：查询天气预报
- /进群自动发送[内容]：新成员进群发送指定内容（仅管理员）
- /全局推送[标题，内容]：向所有群推送消息（仅管理员）</markdown>`);
  }
  else if (content === '/ping') {
    sendMsg(convId, '🏓 pong！机器人在线');
  }
  else if (content.startsWith('/echo ')) {
    sendMsg(convId, `🔊 ${content.slice(6)}`);
  }
  else if (content === '/群在线人数') {
    try {
      const membersData = await apiRequest('GET', `/bot-api/conversations/${convId}/members`);
      const members = extractMembers(membersData);
      const onlineData = await apiRequest('GET', `/bot-api/users/online`);
      const onlineUsers = extractMembers(onlineData);
      const onlineIds = new Set(onlineUsers.map(u => getUserId(u)).filter(id => id != null));
      const onlineInGroup = members.filter(m => {
        const uid = getUserId(m);
        if (uid == null) return false;
        const self = isMemberOnline(m);
        return self !== null ? self : onlineIds.has(uid);
      });
      onlineInGroup.sort((a,b) => getUserId(a) - getUserId(b));
      let reply = `<markdown># 本群在线人数：${onlineInGroup.length}

# 群内在线用户

`;
      reply += onlineInGroup.map((m,i) => `${i+1}. ${getUserName(m)}（ID：\`${getUserId(m)}\`）`).join('\n');
      reply += `</markdown>`;
      sendMsg(convId, reply);
    } catch(e) { log('error', `在线人数失败: ${e.message}`); sendMsg(convId, `获取在线人数失败：${e.message}`); }
  }
  else if (content === '/签到') {
    const today = getTodayStr();
    let data = getCheckinData();
    if (data.date !== today) data = { date: today, conversations: {} };
    const cid = String(convId);
    if (!data.conversations[cid]) data.conversations[cid] = { records: {}, count: 0 };
    const cd = data.conversations[cid];
    if (cd.records[msg.sender_id]) {
      const r = cd.records[msg.sender_id];
      sendMsg(convId, buildCheckinCard(userName, today, r.rank, r.fortuneLevel, r.fortuneDesc, r.star, r.luckyNum, r.color, r.yi, '你已经签过到啦~'));
      return;
    }
    cd.count++;
    const rank = cd.count;
    const { fortune, star, luckyNum, color, yi } = generateFortune();
    cd.records[msg.sender_id] = { time: new Date().toISOString(), rank, fortuneLevel: fortune.level, fortuneDesc: fortune.desc, star, luckyNum, color, yi };
    saveCheckinData(data);
    sendMsg(convId, buildCheckinCard(userName, today, rank, fortune.level, fortune.desc, star, luckyNum, color, yi));
  }
  else if (content.startsWith('/天气')) {
    const match = content.match(/^\/天气\s*\[(.+?)\]/);
    if (!match) { sendMsg(convId, '⚠️格式错误，请使用：/天气[城市]，例如：/天气[北京]'); return; }
    const city = match[1].trim();
    try {
      const res = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1&lang=zh`);
      if (!res.ok) throw new Error(`天气接口返回 ${res.status}`);
      const data = await res.json();
      const cur = data.current_condition[0];
      const area = data.nearest_area[0];
      const cityName = area.areaName[0].value;
      const country = area.country[0].value;
      const forecasts = data.weather.slice(0,3).map(day => {
        const noon = day.hourly.find(h => h.time === '1200') || day.hourly[Math.floor(day.hourly.length/2)];
        return { date: day.date, desc: noon.weatherDesc[0].value, max: day.maxtempC, min: day.mintempC, sunrise: day.astronomy[0].sunrise, sunset: day.astronomy[0].sunset };
      });
      const today = forecasts[0];
      let reply = `<markdown>🌤️ ${cityName}（${country}）天气

**当前天气**

| 项目 | 详情 | 项目 | 详情 |
|------|------|------|------|
| 天气 | ${cur.weatherDesc[0].value} | 温度 | ${cur.temp_C}°C |
| 体感 | ${cur.FeelsLikeC}°C | 湿度 | ${cur.humidity}% |
| 风速 | ${cur.windspeedKmph} km/h | 风向 | ${cur.winddir16Point} |
| 能见度 | ${cur.visibility} km | 气压 | ${cur.pressure} hPa |
| 紫外线 | ${cur.uvIndex} | 降水量 | ${cur.precipMM} mm |
| 云量 | ${cur.cloudcover}% | 今日 | ${today.max}°C / ${today.min}°C |
| 日出 | ${today.sunrise} | 日落 | ${today.sunset} |

**未来预报**

| 日期 | 天气 | 最高 | 最低 |
|------|------|------|------|
`;
      forecasts.forEach(f => { reply += `| ${f.date} | ${f.desc} | ${f.max}°C | ${f.min}°C |\n`; });
      reply += `</markdown>`;
      sendMsg(convId, reply);
    } catch(e) { log('error', `天气失败: ${e.message}`); sendMsg(convId, `❌获取天气失败：${e.message}\n请检查城市名是否正确。`); }
  }
  else if (content.startsWith('/进群自动发送')) {
    const match = content.match(/^\/进群自动发送\s*\[([\s\S]+)\]/);
    if (!match) { sendMsg(convId, '⚠️格式错误，请使用：/进群自动发送[欢迎内容]'); return; }
    const welcomeText = match[1].trim();
    const canUse = await isAdminOrOwner(convId, msg.sender_id, msg.sender);
    if (!canUse) { sendMsg(convId, '❌只有群主或管理员才能设置进群自动发送'); return; }
    const data = getWelcomeData();
    data[String(convId)] = welcomeText;
    saveWelcomeData(data);
    sendMsg(convId, `✅已设置本群进群自动发送\n\n———— 内容预览 ————\n\n${welcomeText}`);
  }
  else if (content.startsWith('/全局推送')) {
    if (msg.sender_id !== 3038) { sendMsg(convId, '❌你没有权限使用此命令'); return; }
    const match = content.match(/^\/全局推送\s*\[(.+?)，([\s\S]+)\]/);
    if (!match) { sendMsg(convId, '⚠️格式错误，请使用：/全局推送[标题，内容]\n内容中用 /n 换行'); return; }
    const title = match[1].trim();
    const body = match[2].trim().replace(/\/n/g, '\n');
    const now = new Date().toLocaleString('zh-CN', { hour12: false });
    const pushMsg = `<markdown># ${title}\n\n> ${now}\n\n${body}</markdown>`;
    const groups = getGroups();
    let success = 0;
    for (const gid of groups) { const ok = await sendMsg(gid, pushMsg); if (ok) success++; }
    sendMsg(convId, `✅已向 ${success}/${groups.length} 个群推送消息`);
  }
}

function handleJoinEvent(data) {
  const convId = data.conversation_id;
  const newUserId = data.user_id || (data.user && data.user.id);
  const welcomeData = getWelcomeData();
  let welcome = welcomeData[String(convId)];
  if (welcome) {
    if (newUserId) welcome = welcome.replace(/<@成员>/g, `<at id="${newUserId}" />`);
    const content = welcome.includes('<markdown>') ? welcome : `<markdown>${welcome}</markdown>`;
    sendMsg(convId, content);
  }
  log('system', `👋 进群事件: ${JSON.stringify(data).slice(0,150)}`);
}

function connect() {
  if (!botKey) { log('error', '请先输入 Bot Key'); return; }
  setStatus('connecting', '连接中...');
  const url = `wss://chat-api.kuke.ink/bot/ws?key=${encodeURIComponent(botKey)}`;
  ws = new WebSocket(url);

  ws.onopen = () => { setStatus('connected', '已连接'); log('system', '✅ WebSocket 已连接'); };
  ws.onmessage = (event) => {
    const text = event.data;
    if (text === 'pong') return;
    let e;
    try { e = JSON.parse(text); } catch { return; }
    if (e.type === 'bot.connection.ready') {
      botUserId = e.data.user_id;
      $('botId').textContent = e.data.bot_id;
      $('userId').textContent = e.data.user_id;
      log('system', `🤖 机器人就绪 bot_id=${e.data.bot_id} user_id=${e.data.user_id}`);
    }
    else if (e.type === 'message.created') { handleMessage(e.data); }
    else if (e.type === 'message.interaction') { log('system', `🔘 按钮交互: ${JSON.stringify(e.data).slice(0,150)}`); }
    else {
      const joinEvents = ['member.joined','conversation.member.joined','user.joined','member.added','conversation.member_added','group.member.joined','conversation.user.joined'];
      if (joinEvents.includes(e.type)) handleJoinEvent(e.data);
      else log('system', `[未知事件] ${e.type}: ${JSON.stringify(e.data).slice(0,200)}`);
    }
  };
  ws.onclose = () => {
    setStatus('disconnected', '已断开');
    log('error', '❌ WebSocket 断开，3秒后重连...');
    botUserId = null;
    $('botId').textContent = '-';
    $('userId').textContent = '-';
    reconnectTimer = setTimeout(connect, 3000);
  };
  ws.onerror = (err) => { log('error', `⚠️ WebSocket 错误`); };
}

function disconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { ws.close(); ws = null; }
  setStatus('disconnected', '未连接');
}

$('connectBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) { disconnect(); $('connectBtn').textContent = '连接'; $('connectBtn').classList.remove('disconnect'); return; }
  botKey = $('botKey').value.trim();
  if (!botKey) { log('error', '请输入 Bot Key'); return; }
  localStorage.setItem('kuke_bot_key', botKey);
  connect();
  $('connectBtn').textContent = '断开';
  $('connectBtn').classList.add('disconnect');
});

// 恢复保存的 Bot Key
const savedKey = localStorage.getItem('kuke_bot_key');
if (savedKey) $('botKey').value = savedKey;

// ========== 全局推送 ==========
let pushVerified = false;

function openPushModal() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('error', '请先连接 Bot'); return; }
  $('pushModal').classList.add('show');
  if (pushVerified) { showPushForm(); } else { showPushPassword(); }
}

function closePushModal() {
  $('pushModal').classList.remove('show');
  $('pushPassword').value = '';
  $('pushTitle').value = '';
  $('pushContent').value = '';
}

function showPushPassword() {
  $('pushModalTitle').textContent = '全局推送 - 密码验证';
  $('pushPasswordStep').style.display = 'block';
  $('pushFormStep').style.display = 'none';
}

function showPushForm() {
  $('pushModalTitle').textContent = '全局推送';
  $('pushPasswordStep').style.display = 'none';
  $('pushFormStep').style.display = 'block';
}

$('pushBtn').addEventListener('click', openPushModal);

$('pushPasswordBtn').addEventListener('click', () => {
  const pwd = $('pushPassword').value.trim();
  if (pwd === '1477') { pushVerified = true; showPushForm(); }
  else { log('error', '密码错误'); }
});

$('pushPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('pushPasswordBtn').click();
});

$('pushSendBtn').addEventListener('click', async () => {
  const title = $('pushTitle').value.trim();
  const content = $('pushContent').value.trim();
  if (!title) { log('error', '请输入标题'); return; }
  const body = content.replace(/\/n/g, '\n');
  const now = new Date().toLocaleString('zh-CN', { hour12: false });
  const pushMsg = `<markdown># ${title}\n\n> ${now}\n\n${body}</markdown>`;
  const groups = getGroups();
  let success = 0;
  for (const gid of groups) { const ok = await sendMsg(gid, pushMsg); if (ok) success++; }
  log('system', `✅已向 ${success}/${groups.length} 个群推送消息`);
  closePushModal();
});

log('system', '控制面板已就绪，请输入 Bot Key 并点击连接');

// ========== 消息发送栏 ==========
let userConversations = [];

function refreshGroupSelect() {
  const select = $('sendGroupSelect');
  const current = select.value;
  select.innerHTML = '';

  if (userConversations.length > 0) {
    // 用户登录后，显示所有会话（群聊+私聊）
    const groups = userConversations.filter(c => c.type === 'group');
    const directs = userConversations.filter(c => c.type === 'direct');

    if (groups.length > 0) {
      const groupOpt = document.createElement('optgroup');
      groupOpt.label = '群聊';
      groups.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.display_title || c.title || `群 ${c.id}`;
        groupOpt.appendChild(opt);
      });
      select.appendChild(groupOpt);
    }
    if (directs.length > 0) {
      const directOpt = document.createElement('optgroup');
      directOpt.label = '私聊';
      directs.forEach(c => {
        const name = c.direct_user?.nickname || c.direct_user?.username || c.display_title || c.title || `用户 ${c.id}`;
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = name;
        directOpt.appendChild(opt);
      });
      select.appendChild(directOpt);
    }
  } else {
    // 未登录用户时，显示 Bot 记录的群
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '选择群...';
    select.appendChild(placeholder);
    const groups = getGroups();
    groups.forEach(gid => {
      const opt = document.createElement('option');
      opt.value = gid;
      opt.textContent = `群 ${gid}`;
      select.appendChild(opt);
    });
  }

  if (current) select.value = current;
}

$('sendMessageBtn').addEventListener('click', async () => {
  const gid = $('sendGroupSelect').value;
  const text = $('sendMessageInput').value.trim();
  const identity = $('sendIdentity').value;
  if (!gid) { log('error', '请先选择群'); return; }
  if (!text) { log('error', '请输入消息内容'); return; }
  if (identity === 'bot') {
    if (!ws || ws.readyState !== WebSocket.OPEN) { log('error', '请先连接 Bot'); return; }
    const ok = await sendMsg(gid, text);
    if (ok) { $('sendMessageInput').value = ''; log('system', `✅ 已用Bot发送到群 ${gid}`); }
  } else {
    if (!userToken) { log('error', '请先登录用户账号'); return; }
    const ok = await sendAsUser(gid, text);
    if (ok) { $('sendMessageInput').value = ''; log('system', `✅ 已用用户身份发送到群 ${gid}`); }
  }
});

$('sendMessageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    $('sendMessageBtn').click();
  }
});

// 初始化群列表
refreshGroupSelect();

// ========== 用户账号登录（以用户身份发消息）==========
let userToken = null;
let userName = '';

function randomHex(length) {
  const bytes = new Uint8Array(Math.ceil(length / 2));
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('').slice(0, length);
}

async function sha256Hex(input) {
  const bytes = new TextEncoder().encode(input);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
}

async function userApiRequest(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  let body;
  if (options.body !== undefined) {
    body = JSON.stringify(options.body);
    headers['Content-Type'] = 'application/json';
  }
  if (userToken) headers['Authorization'] = `Bearer ${userToken}`;
  const method = options.method || 'GET';
  const timestamp = Date.now().toString();
  const nonce = randomHex(16);
  const proofPath = path.split('?')[0] || path;
  headers['X-Kuke-Client'] = 'kukechat-web/0.2.0';
  headers['X-Kuke-Timestamp'] = timestamp;
  headers['X-Kuke-Nonce'] = nonce;
  headers['X-Kuke-Proof'] = await sha256Hex(`${method.toUpperCase()}|${proofPath}|${timestamp}|${nonce}|KukeChat`);
  const url = `${BASE_URL}${path}`;
  const res = await fetch(url, { method, headers, body });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.detail || `请求失败 ${res.status}`);
  return data;
}

async function userLogin() {
  const account = $('userAccount').value.trim();
  const password = $('userPassword').value;
  if (!account || !password) { log('error', '请输入账号和密码'); return; }
  try {
    const data = await userApiRequest('/auth/login', {
      method: 'POST',
      body: { username_or_email: account, password, remember_me: true }
    });
    userToken = data.access_token;
    userName = data.user?.nickname || data.user?.username || account;
    $('userStatus').innerHTML = `<span class="logged-in">已登录：${userName}</span>`;
    $('userAccount').style.display = 'none';
    $('userPassword').style.display = 'none';
    $('userLoginBtn').style.display = 'none';
    $('userLogoutBtn').style.display = 'inline-block';
    const opt = $('sendIdentity').querySelector('option[value="user"]');
    opt.disabled = false;
    opt.textContent = `用户身份（${userName}）`;
    log('system', `✅ 用户登录成功：${userName}`);

    // 拉取用户的所有会话（群聊+私聊）
    try {
      userConversations = await userApiRequest('/conversations');
      refreshGroupSelect();
      log('system', `📋 已加载 ${userConversations.length} 个会话`);
    } catch (e) {
      log('error', `加载会话失败：${e.message}`);
    }
  } catch (e) {
    log('error', `用户登录失败：${e.message}`);
  }
}

function userLogout() {
  userToken = null;
  userName = '';
  userConversations = [];
  $('userStatus').textContent = '未登录用户账号';
  $('userAccount').style.display = '';
  $('userPassword').style.display = '';
  $('userLoginBtn').style.display = '';
  $('userLogoutBtn').style.display = 'none';
  const opt = $('sendIdentity').querySelector('option[value="user"]');
  opt.disabled = true;
  opt.textContent = '用户身份（未登录）';
  $('sendIdentity').value = 'bot';
  refreshGroupSelect();
  log('system', '用户已退出登录');
}

async function sendAsUser(conversationId, text) {
  try {
    await userApiRequest(`/conversations/${conversationId}/messages`, {
      method: 'POST',
      body: { content: text, type: 'text' }
    });
    log('send', `→ [用户][群${conversationId}] ${text.slice(0,80)}${text.length>80?'...':''}`);
    return true;
  } catch (e) {
    log('error', `用户发送失败: ${e.message}`);
    return false;
  }
}

$('userLoginBtn').addEventListener('click', userLogin);
$('userLogoutBtn').addEventListener('click', userLogout);
$('userPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') userLogin();
});
