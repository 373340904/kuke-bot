<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>君灵bot - 运行状态</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #eee;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  text-align: center;
  padding: 40px;
}
.status-card {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 40px 60px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
.status-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #4ade80;
  display: inline-block;
  margin-right: 10px;
  box-shadow: 0 0 12px #4ade80;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
h1 {
  font-size: 28px;
  margin-bottom: 16px;
  color: #e94560;
}
.status-text {
  font-size: 18px;
  color: #4ade80;
  margin-bottom: 24px;
}
.info {
  font-size: 14px;
  color: #888;
  line-height: 1.8;
}
.info p { margin: 4px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="status-card">
    <h1>🤖 君灵bot</h1>
    <div class="status-text">
      <span class="status-dot"></span>
      机器人运行中
    </div>
    <div class="info">
      <p>✅ KukeChat 已连接</p>
      <p>✅ 服务正常运行</p>
      <p>📅 最后更新：2026-08-31</p>
    </div>
  </div>
</div>
</body>
</html>
